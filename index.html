<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mygamez</title>
        <style>
           /* reset & variaveis de cores do Github dark */
{
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
    background-color: #9400D3;
    color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    padding: 20px;
}   

header {
    max-width: 1200px;
    margin: 0 auto 30px auto;
    padding-bottom: 15px;
    border-bottom: 1p solid #30363d;
    display: flex;
    align-items: center;
    gap: 12px;
}

header svg {
    fill: #f0f6fc;
}

header h1 {
font-size: 1.5rem;
  color:  #f0f6fc; 
  font-weight: 600;
}

header spam {
background-color: #21262d;
color: #8b949e;
font-size: 0.8rem ;
padding: 2px 8px;
border-radius: 12px;
border: 1px solid #30363d
}

/*Grid de cards */
.container {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
}

.card {
    background-color: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color 0.2 ease-in-out;
}

.card-img {}
